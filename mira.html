<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF6EC">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Mira · 照见</title>
<style>
:root{
  --paper:#FBF6EC;--ink:#2C2418;--ink-2:#6B5D4F;--ink-3:#B8A99A;
  --amber:#C8622B;--amber-2:#D4783F;--amber-light:#E8A87C;--cream:#FFFCF5;--border:rgba(44,36,24,.08);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit;outline:none;border:none}

/* ========== Opening Screen ========== */
#opening{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;background:radial-gradient(ellipse at 50% 25%,#FFFBF3 0%,var(--paper) 45%,#EDE4D4 100%);transition:opacity .6s ease,transform .6s ease}
#opening.hide{opacity:0;transform:scale(1.06);pointer-events:none}
.orb{width:96px;height:96px;border-radius:50%;position:relative;margin-bottom:28px;background:radial-gradient(circle at 35% 28%,#FFF8ED 0%,#F2D8B0 35%,#D4945A 65%,var(--amber) 100%);box-shadow:0 0 50px rgba(200,98,43,.18),0 0 110px rgba(200,98,43,.08),inset 0 -4px 12px rgba(140,60,15,.2);animation:breathe 4.5s ease-in-out infinite}
.orb::before{content:'';position:absolute;top:14%;left:20%;width:28%;height:36%;background:radial-gradient(ellipse,rgba(255,255,255,.55) 0%,rgba(255,255,255,.1) 60%,transparent 100%);border-radius:50%;transform:rotate(-22deg)}
.orb::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(200,98,43,.12);animation:ring 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.04);filter:brightness(1.06)}}
@keyframes ring{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.15;transform:scale(1.12)}}
#opening h1{font-family:'Songti SC','STSong','SimSun',serif;font-size:44px;font-weight:300;letter-spacing:10px;color:var(--ink);margin-bottom:6px}
.subtitle{font-size:14px;letter-spacing:7px;color:var(--amber);font-weight:300;margin-bottom:34px}
.intro{font-size:14px;line-height:2;color:var(--ink-2);text-align:center;margin-bottom:38px;max-width:240px;font-weight:300}
.field{width:100%;max-width:280px;margin-bottom:16px}
.field input{width:100%;padding:13px 18px;border:1px solid var(--border);border-radius:12px;background:var(--cream);font-size:15px;color:var(--ink);text-align:center;transition:border-color .3s,box-shadow .3s}
.field input:focus{border-color:var(--amber-light);box-shadow:0 0 0 3px rgba(200,98,43,.07)}
.field input::placeholder{color:var(--ink-3)}
.btn-start{width:100%;max-width:280px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--amber-2));color:#fff;font-size:15px;font-weight:500;letter-spacing:3px;transition:transform .15s,box-shadow .2s;box-shadow:0 4px 16px rgba(200,98,43,.22)}
.btn-start:active{transform:scale(.97)}
.btn-start:disabled{opacity:.5;box-shadow:none}
.opening-foot{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font-size:11px;color:var(--ink-3);letter-spacing:1.5px}

/* ========== Chat App（Coze SDK 原装界面，全屏） ========== */
#app{display:none;height:100%;height:100dvh}
#app.show{display:block}
#sdk-root{height:100%;width:100%}
</style>
</head>
<body>

<!-- Opening -->
<div id="opening">
  <div class="orb"></div>
  <h1>Mira</h1>
  <p class="subtitle">照 见</p>
  <p class="intro">我是一面镜子<br>帮你看见可能被忽视的自己</p>
  <div class="field">
    <input type="text" id="nameInput" placeholder="告诉我你的名字" maxlength="20" autocomplete="off" autocorrect="off">
  </div>
  <button class="btn-start" id="startBtn">开 始 对 话</button>
  <p class="opening-foot">夏山启明星创造营 · AI向善工作坊</p>
</div>

<!-- Chat App: Coze 官方 SDK 原装界面 -->
<div id="app">
  <div id="sdk-root"></div>
</div>

<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js"></script>
<script>
(function(){
  'use strict';

  var BOT_ID = '7678287170393735203';
  var PAT = 'pat_M3lmELwIxbXFeM5LwLySJnhB7It0v0itfQfQZGmsaBCf7lrp8guynkaL5G8b06Vh';

  var opening = document.getElementById('opening');
  var app = document.getElementById('app');
  var nameInput = document.getElementById('nameInput');
  var startBtn = document.getElementById('startBtn');
  var sdkRoot = document.getElementById('sdk-root');

  var uid = localStorage.getItem('mira_uid');
  if(!uid){
    uid = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    localStorage.setItem('mira_uid', uid);
  }

  var sdkStarted = false;

  function start(){
    var name = nameInput.value.trim();
    if(!name){ nameInput.focus(); nameInput.style.borderColor = '#E8A87C'; return; }
    if(sdkStarted) return;
    sdkStarted = true;
    startBtn.disabled = true;
    startBtn.textContent = '正 在 进 入…';
    localStorage.setItem('mira_name', name);

    opening.classList.add('hide');
    setTimeout(function(){
      opening.style.display = 'none';
      app.classList.add('show');
      initSDK(name);
    }, 550);
  }

  // ===== 轻量处理：隐藏快捷指令默认图标 + 隐藏「新建会话/关闭」按钮（保护整场对话记忆，成长报告依赖它）=====
  // 纯 CSS + 位置扫描，失败无任何副作用；不碰 SDK 任何逻辑
  // 选择器均来自实测 DOM（SDK 1.2.0-beta.20 cn，无 Shadow DOM）
  var MIRA_CSS = 'header button.coze-chat-sdk-semi-button{display:none !important;}'   /* ➕新建会话：header 内唯一按钮 */
    + '.efa8c49d8ce1a57573bf{display:none !important;}'                               /* ✕关闭：SDK 哈希类，版本锁定后稳定 */
    + 'button[data-testid="bot-edit-debug-chat-clear-button"]{display:none !important;}' /* 🧹左下角清除上下文：防手滑失忆（会话ID不变但上下文被清空） */
    + 'img[alt="icon"]{display:none !important;}';                                    /* 快捷指令破损默认图标，保留文字与头像 */
  function injectMiraCss(root){
    try{
      root = root || document;
      var host = (root === document) ? (document.head || document.documentElement) : root;
      if(host.querySelector && !host.querySelector('style[data-mira-skin]')){
        var st = document.createElement('style');
        st.setAttribute('data-mira-skin','1');
        st.textContent = MIRA_CSS;
        host.appendChild(st);
      }
      if(root.querySelectorAll){
        var hosts = root.querySelectorAll('*');
        for(var i=0;i<hosts.length;i++){
          if(hosts[i].shadowRoot) injectMiraCss(hosts[i].shadowRoot);
        }
      }
    }catch(e){}
  }
  // JS 兜底：✕可能挂在 body 上（不在 sdk-root 内），按位置扫整个文档；顺带藏掉加载失败的图标 img
  function hideByScan(){
    try{
      var vw = window.innerWidth;
      var divs = document.body.querySelectorAll('div');
      for(var i=0;i<divs.length;i++){
        var el = divs[i];
        if(el.style.display === 'none' || el.closest('header')) continue;
        var r = el.getBoundingClientRect();
        if(r.top >= 0 && r.top < 60 && (vw - r.right) < 60 && r.width >= 20 && r.width <= 48 && r.height >= 20 && r.height <= 48
           && el.querySelector('svg')){
          el.style.display = 'none';
        }
      }
      var hb = document.body.querySelectorAll('header button');
      for(var j=0;j<hb.length;j++){ hb[j].style.display = 'none'; }
      var imgs = document.body.querySelectorAll('img');
      for(var k=0;k<imgs.length;k++){
        var im = imgs[k];
        if(im.closest('#opening')) continue;
        if(im.getAttribute('alt') === 'icon' || (im.complete && im.naturalWidth === 0)){
          im.style.display = 'none';
        }
      }
      // 🧹左下角「清除上下文」按钮：连外层 .coz-icon-button 包裹一起隐藏，防学员手滑清空记忆
      var clearBtns = document.body.querySelectorAll('button[data-testid="bot-edit-debug-chat-clear-button"]');
      for(var c=0;c<clearBtns.length;c++){
        clearBtns[c].style.display = 'none';
        var wrap = clearBtns[c].closest('.coz-icon-button');
        if(wrap) wrap.style.display = 'none';
      }
    }catch(e){}
  }
  function startIconHide(){
    injectMiraCss(document);
    hideByScan();
    setInterval(function(){
      injectMiraCss(document);
      hideByScan();
    }, 1000);
  }

  // ===== 入营注册表（成长报告素材索引；纯旁路，失败静默，绝不影响聊天）=====
  // 消息全量永久保存在 Coze 后台（官方存储），这里只上报「姓名↔conversation_id」到飞书归档群，
  // 营队后凭 conv_id 调 Coze 官方消息 API 批量拉全量对话导出成长报告底稿。
  // MIRA_HOOK 为飞书群自定义机器人 webhook（开营前由配置填入；留空则静默跳过，不影响任何功能）
  var MIRA_HOOK = 'https://open.feishu.cn/open-apis/bot/v2/hook/e9e95e6e-c5ae-4c29-af9d-469e91a1fba4';
  var REG = { convId:null };
  var REPORTED = {};
  try{ REPORTED = JSON.parse(localStorage.getItem('mira_reg_convs') || '{}') || {}; }catch(e){ REPORTED = {}; }
  (function installConvHook(){
    // 总是更新为最新 conv_id：学员若点了「新会话/清除上下文」，新会话 ID 也要被抓到登记
    function grab(u){ if(typeof u==='string'){ var m=u.match(/conversation_id=(\d{10,})/); if(m) REG.convId=m[1]; } }
    var of = window.fetch;
    if(of){ window.fetch = function(){ try{ grab(arguments[0] && arguments[0].url ? arguments[0].url : arguments[0]); }catch(e){} return of.apply(this, arguments); }; }
    var oo = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(m,u){ try{ grab(u); }catch(e){} return oo.apply(this, arguments); };
  })();
  function registerTick(){
    if(!MIRA_HOOK || !REG.convId) return;
    var name = localStorage.getItem('mira_name');
    if(!name || REPORTED[REG.convId]) return;
    var cid = REG.convId;
    REPORTED[cid] = 1;
    try{
      var n = Object.keys(REPORTED).length;
      var sid = (localStorage.getItem('mira_uid') || '').slice(-6);
      var text = '🪞 Mira 入营登记\n姓名：'+name+'\n学员ID：'+sid+'\n会话：'+cid+
        (n>1 ? '\n备注：该学员发生过会话切换（第'+n+'个会话，可能误点了新会话），导出时请合并' : '')+
        '\n时间：'+new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
      fetch(MIRA_HOOK, {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({msg_type:'text', content:{text:text}})})
        .then(function(){ localStorage.setItem('mira_reg_convs', JSON.stringify(REPORTED)); })
        .catch(function(){ delete REPORTED[cid]; });
    }catch(e){ delete REPORTED[cid]; }
  }
  function startArchive(){
    setInterval(registerTick, 3000);
    setTimeout(registerTick, 4000);
  }

  function showRetry(msg){
    sdkRoot.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;color:#6B5D4F;font-size:14px;line-height:1.8;">' + msg + '<br><button onclick="location.reload()" style="margin-top:20px;padding:10px 28px;border-radius:10px;background:#C8622B;color:#fff;font-size:14px;">重新连接</button></div>';
  }

  function initSDK(nickname){
    if(typeof CozeWebSDK === 'undefined'){
      showRetry('镜子好像蒙了一层雾…<br>请检查网络后重新打开');
      return;
    }

    sdkRoot.innerHTML = '<div id="miraLoading" style="display:flex;align-items:center;justify-content:center;height:100%;color:#B8A99A;font-size:14px;">镜子正在擦亮…</div>';

    var client = null;
    try{
      client = new CozeWebSDK.WebChatClient({
        config: {
          botId: BOT_ID,
          isIframe: false
        },
        auth: {
          type: 'token',
          token: PAT,
          onRefreshToken: function(){
            return new Promise(function(resolve){ resolve(PAT); });
          }
        },
        userInfo: {
          id: uid,
          nickname: nickname || '朋友'
        },
        ui: {
          base: {
            layout: 'mobile',
            lang: 'zh-CN'
          },
          asstBtn: { isNeed: false },
          chatBot: {
            title: 'Mira',
            uploadable: false,
            el: sdkRoot,
            onShow: function(){
              var l = document.getElementById('miraLoading');
              if(l) l.style.display = 'none';
            }
          },
          footer: { isShow: false }
        }
      });
      if(client && typeof client.showChatBot === 'function'){
        client.showChatBot();
      }
      startIconHide();
      startArchive();
    }catch(e){
      showRetry('初始化失败，请刷新重试');
      return;
    }

    setTimeout(function(){
      var l = document.getElementById('miraLoading');
      if(l && l.style.display !== 'none' && sdkRoot.querySelectorAll('iframe').length === 0){
        showRetry('镜子加载得有点慢…<br>可能是网络问题，请重试');
      }
    }, 12000);
  }

  var savedName = localStorage.getItem('mira_name');
  if(savedName){ nameInput.value = savedName; }

  startBtn.addEventListener('click', start);
  nameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); start(); }
  });

})();
</script>
</body>
</html>
