<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF6EC">
<title>Mira · 照见</title>
<style>
:root{
  --paper:#FBF6EC;--paper-2:#F5EEE0;--ink:#2C2418;--ink-2:#6B5D4F;--ink-3:#B8A99A;
  --amber:#C8622B;--amber-2:#D4783F;--amber-light:#E8A87C;--amber-soft:#F5D5B8;
  --cream:#FFFCF5;--border:rgba(44,36,24,.08);--shadow:rgba(44,36,24,.06);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit;outline:none;border:none}

/* ========== Opening Screen ========== */
#opening{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;background:radial-gradient(ellipse at 50% 25%,#FFFBF3 0%,var(--paper) 45%,#EDE4D4 100%);transition:opacity .6s ease,transform .6s ease}
#opening.hide{opacity:0;transform:scale(1.06);pointer-events:none}
.orb{width:96px;height:96px;border-radius:50%;position:relative;margin-bottom:28px;background:radial-gradient(circle at 35% 28%,#FFF8ED 0%,#F2D8B0 35%,#D4945A 65%,var(--amber) 100%);box-shadow:0 0 50px rgba(200,98,43,.18),0 0 110px rgba(200,98,43,.08),inset 0 -4px 12px rgba(140,60,15,.2);animation:breathe 4.5s ease-in-out infinite}
.orb::before{content:'';position:absolute;top:14%;left:20%;width:28%;height:36%;background:radial-gradient(ellipse,rgba(255,255,255,.55) 0%,rgba(255,255,255,.1) 60%,transparent 100%);border-radius:50%;transform:rotate(-22deg)}
.orb::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(200,98,43,.12);animation:ring 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.04);filter:brightness(1.06)}}
@keyframes ring{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.15;transform:scale(1.12)}}
#opening h1{font-family:'Songti SC','STSong','SimSun',serif;font-size:44px;font-weight:300;letter-spacing:10px;color:var(--ink);margin-bottom:6px}
.subtitle{font-size:14px;letter-spacing:7px;color:var(--amber);font-weight:300;margin-bottom:34px}
.intro{font-size:14px;line-height:2;color:var(--ink-2);text-align:center;margin-bottom:38px;max-width:240px;font-weight:300}
.field{width:100%;max-width:280px;margin-bottom:16px}
.field input{width:100%;padding:13px 18px;border:1px solid var(--border);border-radius:12px;background:var(--cream);font-size:15px;color:var(--ink);text-align:center;transition:border-color .3s,box-shadow .3s}
.field input:focus{border-color:var(--amber-light);box-shadow:0 0 0 3px rgba(200,98,43,.07)}
.field input::placeholder{color:var(--ink-3)}
.btn-start{width:100%;max-width:280px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--amber-2));color:#fff;font-size:15px;font-weight:500;letter-spacing:3px;transition:transform .15s,box-shadow .2s;box-shadow:0 4px 16px rgba(200,98,43,.22)}
.btn-start:active{transform:scale(.97)}
.btn-start:disabled{opacity:.5;box-shadow:none}
.opening-foot{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font-size:11px;color:var(--ink-3);letter-spacing:1.5px}

/* ========== Chat App ========== */
#app{display:none;flex-direction:column;height:100%;height:100dvh;background:var(--paper)}
#app.show{display:flex}
.topbar{flex-shrink:0;display:flex;align-items:center;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(251,246,236,.92);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--border);z-index:10;position:relative}
.tb-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;margin-right:11px;background:radial-gradient(circle at 35% 28%,#FFF8ED,#F2D8B0 40%,var(--amber) 100%);box-shadow:0 2px 8px rgba(200,98,43,.18);position:relative}
.tb-avatar::after{content:'';position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#7CB342;border:2px solid var(--paper)}
.tb-info h2{font-family:'Songti SC','STSong',serif;font-size:16px;font-weight:500;line-height:1.2}
.tb-info p{font-size:11px;color:var(--amber);letter-spacing:.5px;margin-top:1px}

/* SDK container: explicit dimensions for el mounting */
#sdk-root{flex:1;min-height:0;position:relative;overflow:hidden;width:100%}

/* ========== SDK DOM Overrides (conservative) ========== */
#sdk-root *{box-sizing:border-box}

/* Only hide the SDK's own top title bar (very specific selectors) */
#sdk-root .coze-chat-sdk-header,
#sdk-root [data-testid="chat-header"]{display:none!important}

/* Chat backgrounds */
#sdk-root [class*="chat-container"],
#sdk-root [class*="ChatContainer"],
#sdk-root [class*="chat-layout"],
#sdk-root [class*="chat-body"],
#sdk-root [class*="chat-content"],
#sdk-root [class*="message-list"],
#sdk-root [class*="msg-list"],
#sdk-root [class*="chat-inner"]{
  background:transparent!important;
}

/* Message row */
#sdk-root [class*="message-item"],
#sdk-root [class*="message-row"],
#sdk-root [class*="msg-item"]{
  padding:6px 16px!important;background:transparent!important;
}

/* Assistant bubble */
#sdk-root [class*="assistant"] [class*="bubble"],
#sdk-root [class*="assistant"] [class*="content"],
#sdk-root [class*="bot-message"] [class*="bubble"],
#sdk-root [class*="left-message"] [class*="bubble"],
#sdk-root [class*="receive"] [class*="bubble"],
#sdk-root [class*="receive"] [class*="content"],
#sdk-root [class*="answer"] [class*="bubble"],
#sdk-root [class*="answer"] [class*="content"]{
  background:var(--cream)!important;color:var(--ink)!important;
  border:1px solid var(--border)!important;border-radius:4px 18px 18px 18px!important;
  box-shadow:0 1px 3px var(--shadow)!important;padding:11px 15px!important;
  font-size:15px!important;line-height:1.75!important;
}

/* User bubble */
#sdk-root [class*="user-message"] [class*="bubble"],
#sdk-root [class*="user-message"] [class*="content"],
#sdk-root [class*="right-message"] [class*="bubble"],
#sdk-root [class*="send"] [class*="bubble"],
#sdk-root [class*="send"] [class*="content"],
#sdk-root [class*="query"] [class*="bubble"],
#sdk-root [class*="query"] [class*="content"]{
  background:linear-gradient(135deg,var(--amber),var(--amber-2))!important;
  color:#fff!important;border:none!important;
  border-radius:18px 4px 18px 18px!important;
  box-shadow:0 2px 8px rgba(200,98,43,.18)!important;padding:11px 15px!important;
  font-size:15px!important;line-height:1.75!important;
}

/* Avatars */
#sdk-root [class*="avatar"]{border-radius:50%!important;overflow:hidden}
#sdk-root [class*="assistant"] [class*="avatar"],
#sdk-root [class*="bot"] [class*="avatar"]{
  background:radial-gradient(circle at 35% 28%,#FFF8ED,#F2D8B0 40%,var(--amber) 100%)!important;
}
#sdk-root [class*="user"] [class*="avatar"]{
  background:linear-gradient(135deg,#E8C9A8,#C8A882)!important;
}

/* Input area */
#sdk-root [class*="input-area"],
#sdk-root [class*="input-bar"],
#sdk-root [class*="chat-input"],
#sdk-root [class*="chat-footer"],
#sdk-root [class*="input-container"],
#sdk-root [class*="editor"],
#sdk-root [class*="input-wrapper"]{
  background:var(--cream)!important;border-top:1px solid var(--border)!important;
  padding:10px 14px!important;padding-bottom:max(10px,env(safe-area-inset-bottom))!important;
}
#sdk-root textarea,
#sdk-root [contenteditable="true"]{
  background:var(--paper)!important;border:1px solid var(--border)!important;
  border-radius:22px!important;padding:10px 16px!important;font-size:15px!important;
  color:var(--ink)!important;line-height:1.5!important;min-height:40px!important;max-height:100px!important;
}
#sdk-root textarea::placeholder{color:var(--ink-3)!important}

/* Send button */
#sdk-root [class*="send-btn"],
#sdk-root [class*="send-button"],
#sdk-root button[class*="send"]{
  background:var(--amber)!important;color:#fff!important;border-radius:50%!important;
  width:36px!important;height:36px!important;display:flex!important;align-items:center!important;
  justify-content:center!important;box-shadow:0 2px 8px rgba(200,98,43,.2)!important;
}

/* Hide brand */
#sdk-root [class*="powered"],#sdk-root [class*="copyright"],
#sdk-root [class*="brand"],#sdk-root [class*="logo-link"],
#sdk-root [class*="coze-brand"],#sdk-root [class*="footer-text"]{display:none!important}

/* Scrollbar */
#sdk-root ::-webkit-scrollbar{width:0;height:0;display:none}
#sdk-root *{scrollbar-width:none}

/* Error */
#sdk-error{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;color:var(--ink-2)}
#sdk-error.show{display:flex}
#sdk-error p{font-size:14px;line-height:1.8;margin-bottom:20px}
#sdk-error button{padding:10px 28px;border-radius:10px;background:var(--amber);color:#fff;font-size:14px}

/* Loading */
.init-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;color:var(--ink-3);font-size:14px;background:var(--paper)}
.init-loading .dots{display:inline-flex;gap:4px;margin-left:8px}
.init-loading .dots span{width:7px;height:7px;border-radius:50%;background:var(--amber-soft);animation:bounce 1.3s ease-in-out infinite}
.init-loading .dots span:nth-child(2){animation-delay:.15s}
.init-loading .dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<!-- Opening -->
<div id="opening">
  <div class="orb"></div>
  <h1>Mira</h1>
  <p class="subtitle">照 见</p>
  <p class="intro">我是一面镜子<br>帮你看见可能被忽视的自己</p>
  <div class="field">
    <input type="text" id="nameInput" placeholder="告诉我你的名字" maxlength="20" autocomplete="off" autocorrect="off">
  </div>
  <button class="btn-start" id="startBtn">开 始 对 话</button>
  <p class="opening-foot">夏山启明星创造营 · AI向善工作坊</p>
</div>

<!-- Chat App -->
<div id="app">
  <div class="topbar">
    <div class="tb-avatar"></div>
    <div class="tb-info">
      <h2>Mira</h2>
      <p>照见 · 在线</p>
    </div>
  </div>
  <div id="sdk-root">
    <div class="init-loading" id="initLoading">镜子正在擦亮<span class="dots"><span></span><span></span><span></span></span></div>
    <div id="sdk-error">
      <p>镜子好像蒙了一层雾…<br>请检查网络后重新打开</p>
      <button onclick="location.reload()">重新连接</button>
    </div>
  </div>
</div>

<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js"></script>
<script>
(function(){
  'use strict';

  var BOT_ID = '7678287170393735203';
  var PAT = 'pat_M3lmELwIxbXFeM5LwLySJnhB7It0v0itfQfQZGmsaBCf7lrp8guynkaL5G8b06Vh';

  var uid = localStorage.getItem('mira_uid');
  if(!uid){
    uid = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    localStorage.setItem('mira_uid', uid);
  }

  var opening = document.getElementById('opening');
  var app = document.getElementById('app');
  var nameInput = document.getElementById('nameInput');
  var startBtn = document.getElementById('startBtn');
  var sdkRoot = document.getElementById('sdk-root');
  var initLoading = document.getElementById('initLoading');
  var sdkError = document.getElementById('sdk-error');
  var sdkClient = null;

  function hideLoading(){
    initLoading.style.display = 'none';
  }

  function showError(msg){
    initLoading.style.display = 'none';
    if(msg){ sdkError.querySelector('p').innerHTML = msg; }
    sdkError.classList.add('show');
  }

  function initSDK(nickname){
    if(typeof CozeWebSDK === 'undefined'){
      showError('SDK 加载失败，请刷新重试');
      return;
    }

    console.log('[Mira] SDK 开始初始化, botId:', BOT_ID);

    try{
      sdkClient = new CozeWebSDK.WebChatClient({
        config: {
          botId: BOT_ID,
          isIframe: false
        },
        auth: {
          type: 'token',
          token: PAT,
          onRefreshToken: function(){
            return new Promise(function(resolve){ resolve(PAT); });
          }
        },
        userInfo: {
          id: uid,
          nickname: nickname || '朋友'
        },
        ui: {
          base: {
            layout: 'mobile',
            lang: 'zh-CN'
          },
          asstBtn: { isNeed: false },
          chatBot: {
            title: 'Mira',
            uploadable: false,
            el: sdkRoot,
            onShow: function(){
              console.log('[Mira] SDK onShow 回调触发');
              hideLoading();
            },
            onHide: function(){
              console.log('[Mira] SDK onHide 回调触发');
            }
          },
          footer: { isShow: false }
        }
      });

      console.log('[Mira] WebChatClient 构造完成，尝试 showChatBot...');
      console.log('[Mira] sdkClient 方法:', Object.keys(sdkClient).join(', '));

      // el 挂载模式下需要主动显示聊天框
      if(typeof sdkClient.showChatBot === 'function'){
        sdkClient.showChatBot();
        console.log('[Mira] showChatBot() 已调用');
      }else{
        console.warn('[Mira] showChatBot 方法不存在，SDK可能自动渲染');
      }

      // 安全超时：5秒后检查状态
      setTimeout(function(){
        var sdkDom = sdkRoot.querySelector('[class*="coze-chat"], [class*="chat-sdk"], iframe');
        var visibleChildren = 0;
        for(var i=0; i<sdkRoot.children.length; i++){
          var c = sdkRoot.children[i];
          if(c.id !== 'initLoading' && c.id !== 'sdk-error' && c.offsetHeight > 0){
            visibleChildren++;
          }
        }
        console.log('[Mira] 5秒检查 - sdkDom:', sdkDom, '可见子元素数:', visibleChildren);
        if(initLoading.style.display !== 'none' && visibleChildren > 0){
          hideLoading();
        }
      }, 5000);

      // 1秒后先隐藏loading（即使onShow没触发，让用户看到界面）
      setTimeout(function(){
        if(initLoading.style.display !== 'none'){
          console.log('[Mira] 1秒安全超时，强制隐藏loading');
          hideLoading();
        }
      }, 1000);

    }catch(e){
      console.error('[Mira] SDK init error:', e);
      showError('初始化失败：' + e.message + '<br>请刷新重试');
    }
  }

  function start(){
    var name = nameInput.value.trim();
    if(!name){ nameInput.focus(); nameInput.style.borderColor = '#E8A87C'; return; }
    startBtn.disabled = true;
    startBtn.textContent = '正 在 进 入…';
    localStorage.setItem('mira_name', name);

    opening.classList.add('hide');
    setTimeout(function(){
      opening.style.display = 'none';
      app.classList.add('show');
      // 确保 app 已渲染后再初始化 SDK
      requestAnimationFrame(function(){
        initSDK(name);
      });
    }, 550);
  }

  var savedName = localStorage.getItem('mira_name');
  if(savedName){ nameInput.value = savedName; }

  startBtn.addEventListener('click', start);
  nameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); start(); }
  });

})();
</script>
</body>
</html>
