<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF6EC">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Mira · 照见</title>
<style>
:root{
  --paper:#FBF6EC;--ink:#2C2418;--ink-2:#6B5D4F;--ink-3:#B8A99A;
  --amber:#C8622B;--amber-2:#D4783F;--amber-light:#E8A87C;--cream:#FFFCF5;--border:rgba(44,36,24,.08);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;outline:none;border:none}

/* ========== Opening Screen ========== */
#opening{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;background:radial-gradient(ellipse at 50% 25%,#FFFBF3 0%,var(--paper) 45%,#EDE4D4 100%);transition:opacity .6s ease,transform .6s ease}
#opening.hide{opacity:0;transform:scale(1.06);pointer-events:none}
.orb{width:96px;height:96px;border-radius:50%;position:relative;margin-bottom:28px;background:radial-gradient(circle at 35% 28%,#FFF8ED 0%,#F2D8B0 35%,#D4945A 65%,var(--amber) 100%);box-shadow:0 0 50px rgba(200,98,43,.18),0 0 110px rgba(200,98,43,.08),inset 0 -4px 12px rgba(140,60,15,.2);animation:breathe 4.5s ease-in-out infinite}
.orb::before{content:'';position:absolute;top:14%;left:20%;width:28%;height:36%;background:radial-gradient(ellipse,rgba(255,255,255,.55) 0%,rgba(255,255,255,.1) 60%,transparent 100%);border-radius:50%;transform:rotate(-22deg)}
.orb::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(200,98,43,.12);animation:ring 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.04);filter:brightness(1.06)}}
@keyframes ring{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.15;transform:scale(1.12)}}
#opening h1{font-family:'Songti SC','STSong','SimSun',serif;font-size:44px;font-weight:300;letter-spacing:10px;color:var(--ink);margin-bottom:6px}
.subtitle{font-size:14px;letter-spacing:7px;color:var(--amber);font-weight:300;margin-bottom:34px}
.intro{font-size:14px;line-height:2;color:var(--ink-2);text-align:center;margin-bottom:38px;max-width:240px;font-weight:300}
.field{width:100%;max-width:280px;margin-bottom:16px}
.field input{width:100%;padding:13px 18px;border:1px solid var(--border);border-radius:12px;background:var(--cream);font-size:15px;color:var(--ink);text-align:center;transition:border-color .3s,box-shadow .3s}
.field input:focus{border-color:var(--amber-light);box-shadow:0 0 0 3px rgba(200,98,43,.07)}
.field input::placeholder{color:var(--ink-3)}
.btn-start{width:100%;max-width:280px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--amber-2));color:#fff;font-size:15px;font-weight:500;letter-spacing:3px;transition:transform .15s,box-shadow .2s;box-shadow:0 4px 16px rgba(200,98,43,.22)}
.btn-start:active{transform:scale(.97)}
.btn-start:disabled{opacity:.5;box-shadow:none}
.opening-foot{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font-size:11px;color:var(--ink-3);letter-spacing:1.5px}

/* ========== Anchor Screen（成长锚点热身） ========== */
#anchor{position:fixed;inset:0;z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;background:radial-gradient(ellipse at 50% 25%,#FFFBF3 0%,var(--paper) 45%,#EDE4D4 100%);transition:opacity .6s ease,transform .6s ease}
#anchor.show{display:flex}
#anchor.hide{opacity:0;transform:scale(1.06);pointer-events:none}
#anchor h1{font-family:'Songti SC','STSong','SimSun',serif;font-weight:300;color:var(--ink)}

/* ========== Chat Screen ========== */
#app{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper)}
#app.show{display:flex}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,#FFFCF5 0%,var(--paper) 100%);border-bottom:1px solid var(--border);z-index:5}
.mini-orb{width:30px;height:30px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 28%,#FFF8ED 0%,#F2D8B0 40%,var(--amber) 100%);box-shadow:0 2px 8px rgba(200,98,43,.25)}
.topbar .t{font-family:'Songti SC','STSong',serif;font-size:17px;letter-spacing:3px;color:var(--ink)}
.topbar .s{font-size:10px;color:var(--ink-3);letter-spacing:2px;margin-left:auto}
.msgs{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px 10px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;max-width:86%;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;margin-top:2px}
.msg.bot .avatar{background:radial-gradient(circle at 35% 28%,#FFF8ED 0%,#F2D8B0 40%,var(--amber) 100%);margin-right:9px;box-shadow:0 2px 6px rgba(200,98,43,.2)}
.msg.user .avatar{background:#E9E0D2;color:#6B5D4F;font-size:14px;display:flex;align-items:center;justify-content:center;margin-left:9px;font-weight:500}
.bubble{padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.7;word-break:break-word;white-space:pre-wrap;overflow-wrap:break-word}
.msg.bot .bubble{background:var(--cream);border:1px solid var(--border);border-top-left-radius:5px;color:var(--ink);box-shadow:0 1px 4px rgba(44,36,24,.04)}
.msg.user .bubble{background:linear-gradient(135deg,var(--amber),var(--amber-2));color:#fff;border-top-right-radius:5px;box-shadow:0 2px 8px rgba(200,98,43,.18)}
.bubble strong{font-weight:600}
.bubble .md-h{font-weight:600;display:block;margin:6px 0 2px}
.bubble ul{padding-left:18px;margin:4px 0}
.bubble li{margin:2px 0}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.retry-tip{font-size:12px;color:var(--amber);margin-top:5px;display:flex;align-items:center;gap:6px}
.retry-tip button{text-decoration:underline;color:var(--amber);font-size:12px}
.chips{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:8px 14px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:18px;background:var(--cream);border:1px solid rgba(200,98,43,.25);color:var(--amber);font-size:13px;white-space:nowrap;transition:transform .12s,opacity .2s}
.chip:active{transform:scale(.95)}
.chip:disabled{opacity:.5}
.composer{flex:0 0 auto;padding:8px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(0deg,#FFFCF5 0%,var(--paper) 100%);border-top:1px solid var(--border)}
.composer form{display:flex;gap:9px;align-items:flex-end}
.composer textarea{flex:1;resize:none;max-height:96px;min-height:42px;padding:11px 14px;border-radius:20px;border:1px solid var(--border);background:var(--cream);font-size:15px;line-height:1.4;color:var(--ink)}
.composer textarea:focus{border-color:var(--amber-light)}
.composer textarea::placeholder{color:var(--ink-3)}
.send-btn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--amber-2));color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(200,98,43,.25);transition:transform .12s,opacity .2s}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.45;box-shadow:none}
.attach-btn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--cream);border:1px solid rgba(200,98,43,.3);color:var(--amber);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.attach-btn:active{transform:scale(.92)}
.attach-bar{display:none;flex-wrap:wrap;gap:6px;padding:0 2px 8px}
.attach-bar.has{display:flex}
.attach-item{display:flex;align-items:center;gap:6px;max-width:100%;padding:6px 10px;border-radius:14px;background:var(--cream);border:1px solid rgba(200,98,43,.25);font-size:12px;color:var(--ink-2)}
.attach-item img{width:30px;height:30px;object-fit:cover;border-radius:6px;flex:0 0 auto}
.attach-item .a-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.attach-item .a-status{color:var(--ink-3);font-size:11px;white-space:nowrap}
.attach-item .a-x{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:none;background:rgba(200,98,43,.15);color:var(--amber);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.msg-attach{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.msg-attach .a-file{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.55);font-size:12px;color:inherit}
.msg-attach img{max-width:180px;max-height:180px;border-radius:10px;border:1px solid rgba(0,0,0,.08);display:block}
</style>
</head>
<body>

<!-- Opening -->
<div id="opening">
  <div class="orb"></div>
  <h1>Mira</h1>
  <p class="subtitle">照 见</p>
  <p class="intro">我是一面镜子<br>帮你看见可能被忽视的自己</p>
  <div class="field">
    <input type="text" id="nameInput" placeholder="告诉我你的名字" maxlength="20" autocomplete="off" autocorrect="off">
  </div>
  <button class="btn-start" id="startBtn">开 始 对 话</button>
  <p class="opening-foot">夏山启明星创造营 · AI向善工作坊</p>
</div>

<!-- Anchor（成长锚点热身页：扫码后、闯关前） -->
<div id="anchor">
  <div class="orb" style="width:72px;height:72px;margin-bottom:20px"></div>
  <h1 style="font-size:30px;letter-spacing:6px;margin-bottom:16px">成长锚点</h1>
  <p class="intro" style="margin-bottom:26px">正式照镜子前，先留下一个词。<br>结营时，我会把它还给你。</p>
  <p style="font-size:16px;color:var(--ink-2);margin-bottom:8px;text-align:center;line-height:1.9">AI 永远不能替代我的是</p>
  <div class="field" style="margin-bottom:26px">
    <input type="text" id="anchorInput" placeholder="一个词，比如：创造力" maxlength="20" autocomplete="off" autocorrect="off">
  </div>
  <button class="btn-start" id="anchorBtn">收 好，开 始 照 镜 子</button>
  <p class="opening-foot">夏山启明星创造营 · AI向善工作坊</p>
</div>

<!-- Chat -->
<div id="app">
  <div class="topbar">
    <div class="mini-orb"></div>
    <span class="t">Mira</span>
    <span class="s">照 见</span>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="chips" id="chips">
    <button class="chip" data-q="老师好，我们组路演完了，想请你正式评审一下我们的方案。" data-hidden="【Day2正式路演评审任务】我是评委团的老师。注意：这不是路演前演练，路演已经正式结束，现在你是评委团的AI评委，对小组做正式评审。我会把每一组的路演内容发给你，你直接输出完整评审结论——不要向我提问，不要让小组回答问题，不要扮演家长/孩子/运营者和我对话，不要等我回复，一次性把评审写完。严格按以下四个标题输出，一个都不能少：🌟亮点：1-2个真正动人、真正不一样的地方，具体说出打动你的点；🔍盲区与风险：1-2个最需要再想清楚的问题，直接写出你的判断（目标用户理解是否真实？能落地吗？安全/成本/师资/天气？孩子是真成长还是只是好玩？团队每个人都参与了吗？），不要写成反问句；💡一条落地建议：只给一条，最值得现在就改的那件事；💬一句话总评：送给这个小组的镜子式点评，真诚、具体、有力量。规则：不打分、不排名、不比较各组高低；整段350字以内；如果信息不足以评审，直接说缺什么，不要编造。收到这条消息只回复：「已就绪，请发第一组的路演内容。」">🎤 路演评审</button>
    <button class="chip" data-q="我们组想请你帮我们补方案盲区。你先问问我们方案的情况，我们一个个回答，然后你可以从不同视角给我们反馈。比如家长、孩子、运营者">🔍 补盲区</button>
    <button class="chip" data-q="我想进入Dora的AI向善工作坊场景">🌱 AI向善</button>
  </div>
  <div class="composer">
    <div class="attach-bar" id="attachBar"></div>
    <form id="chatForm">
      <button type="button" class="attach-btn" id="attachBtn" aria-label="添加附件">＋</button>
      <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.md,.ppt,.pptx,.xls,.xlsx,.csv" multiple style="display:none">
      <textarea id="chatInput" rows="1" placeholder="和 Mira 说点什么，也可以发方案图片/文档…"></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="发送">↑</button>
    </form>
  </div>
</div>

<script src="lib/jszip.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script>
if(window['pdfjsLib']){ pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js'; }
</script>
<script>
(function(){
  'use strict';

  // 一键重置：URL 带 ?reset=1 时清空本机全部 Mira 数据，回到新机状态（用于测试/换人）
  if (/[?&]reset=1\b/.test(location.search)) {
    ['mira_uid','mira_name','mira_anchor','mira_conv_id','mira_msgs','mira_reg_convs'].forEach(function(k){ localStorage.removeItem(k); });
    history.replaceState(null, '', location.pathname);
    location.reload();
  }

  var BOT_ID = '7678287170393735203';
  var PAT = 'pat_M3lmELwIxbXFeM5LwLySJnhB7It0v0itfQfQZGmsaBCf7lrp8guynkaL5G8b06Vh';
  var API = 'https://api.coze.cn';
  var MIRA_HOOK = 'https://open.feishu.cn/open-apis/bot/v2/hook/e9e95e6e-c5ae-4c29-af9d-469e91a1fba4';

  var PROLOGUE = '**👋你好{name}，我是Mira。我是一面镜子，帮你看见你可能没察觉的自己。**\n\n听说夏山的教官常说"去野，去长大"。今天我也想陪你野一点，照照镜子。\n\n🔒 你的成长锚点我已经收好了——「**{anchor}**」。结营时，我会把它还给你。\n\n现在点下方「🎤 路演评审」可以请我当评委，也欢迎随时和我聊你在想什么——我不会评判你，也不会替你做决定，我只是帮你看见。';

  // ===== 设备级身份（每台手机独立，互不可见）=====
  var uid = localStorage.getItem('mira_uid');
  if(!uid){
    uid = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    localStorage.setItem('mira_uid', uid);
  }

  var opening = document.getElementById('opening');
  var anchor = document.getElementById('anchor');
  var app = document.getElementById('app');
  var nameInput = document.getElementById('nameInput');
  var startBtn = document.getElementById('startBtn');
  var anchorInput = document.getElementById('anchorInput');
  var anchorBtn = document.getElementById('anchorBtn');
  var msgsEl = document.getElementById('msgs');
  var chatForm = document.getElementById('chatForm');
  var chatInput = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');
  var attachBtn = document.getElementById('attachBtn');
  var fileInput = document.getElementById('fileInput');
  var attachBar = document.getElementById('attachBar');
  var chips = document.querySelectorAll('.chip');

  var name = localStorage.getItem('mira_name') || '';
  var anchorWord = localStorage.getItem('mira_anchor') || '';
  var convId = localStorage.getItem('mira_conv_id') || null;
  var messages = [];   // {role:'bot'|'user', content, failed}
  var anchorInjected = false;
  var busy = false;
  var pendingAtts = []; // 待发送附件 {file,name,isImage,status,thumb,fileId,docText,error}
  var started = false;
  var reported = {};
  try{ reported = JSON.parse(localStorage.getItem('mira_reg_convs') || '{}') || {}; }catch(e){ reported = {}; }

  // ===== 工具 =====
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // 轻量 markdown：粗体、标题、无序列表（先转义再渲染，防 XSS）
  function md(s){
    var t = esc(s);
    t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t = t.replace(/^###\s*(.+)$/gm,'<span class="md-h">$1</span>');
    t = t.replace(/^##\s*(.+)$/gm,'<span class="md-h">$1</span>');
    t = t.replace(/^#\s*(.+)$/gm,'<span class="md-h">$1</span>');
    t = t.replace(/(^|\n)[-•]\s+(.+)/g,'$1<li>$2</li>');
    t = t.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>').replace(/<\/ul>\s*<ul>/g,'');
    return t;
  }
  // 模型偶发「整段复读」兜底：若回复为 X+X（块长≥80字）自动截断为一段
  function dedupReply(t){
    if(!t || t.length < 160) return t;
    var s = t.trim();
    var L = s.length;
    for(var k = Math.floor(L/2); k >= 80; k--){
      var a = s.slice(0, k).trim();
      var b = s.slice(k, k + a.length + 4).trim().slice(0, a.length);
      if(a.length >= 80 && a === b){
        return s.slice(0, k).trim();
      }
    }
    return t;
  }
  function scrollBottom(){ msgsEl.scrollTop = msgsEl.scrollHeight; }
  function avatarChar(){ return name ? name.charAt(0) : '我'; }

  function renderMsg(m){
    var div = document.createElement('div');
    div.className = 'msg ' + m.role;
    var av = document.createElement('div');
    av.className = 'avatar';
    if(m.role === 'user') av.textContent = avatarChar();
    var bub = document.createElement('div');
    bub.className = 'bubble';
    bub.innerHTML = m.typing ? '<span class="typing"><i></i><i></i><i></i></span>' : md(m.role === 'bot' ? dedupReply(m.content) : m.content);
    if(m.attachments && m.attachments.length){
      var ma = document.createElement('div');
      ma.className = 'msg-attach';
      m.attachments.forEach(function(at){
        if(at.isImage && at.thumb){
          var im = document.createElement('img');
          im.src = at.thumb;
          im.alt = at.name;
          ma.appendChild(im);
        }else{
          var chip = document.createElement('span');
          chip.className = 'a-file';
          chip.textContent = (at.isImage ? '🖼️ ' : '📄 ') + at.name;
          ma.appendChild(chip);
        }
      });
      bub.appendChild(ma);
    }
    div.appendChild(av);
    div.appendChild(bub);
    if(m.failed){
      var tip = document.createElement('div');
      tip.className = 'retry-tip';
      tip.innerHTML = '<span>网络好像开了小差…</span><button type="button">重试</button>';
      tip.querySelector('button').addEventListener('click', function(){
        tip.remove();
        var lastUser = null;
        for(var i=messages.length-1;i>=0;i--){ if(messages[i].role==='user' && messages[i].failed){ lastUser = messages[i]; break; } }
        if(lastUser){ lastUser.failed = false; }
        sendMessage(m.retryText || '', true, m.retryHidden, m.retryAtts || null);
      });
      bub.appendChild(tip);
    }
    msgsEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function loadHistory(){
    try{ messages = JSON.parse(localStorage.getItem('mira_msgs') || '[]'); }catch(e){ messages = []; }
    for(var i=0;i<messages.length;i++){ renderMsg(messages[i]); }
  }
  function persist(){
    try{
      if(messages.length > 200){ messages = messages.slice(-200); }
      localStorage.setItem('mira_msgs', JSON.stringify(messages));
    }catch(e){}
  }

  // ===== 入营登记：姓名+学员ID+会话ID → 飞书归档群（纯旁路，失败静默）=====
  function registerConv(){
    if(!MIRA_HOOK || !convId || !name || reported[convId]) return;
    reported[convId] = 1;
    var sid = (uid || '').slice(-6);
    var n = Object.keys(reported).length;
    var text = '🪞 Mira 入营登记\n姓名：' + name + '\n学员ID：' + sid + '\n会话：' + convId +
      (n>1 ? '\n备注：该学员发生过会话切换（第'+n+'个会话），导出时请合并' : '') +
      '\n时间：' + new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
    fetch(MIRA_HOOK, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({msg_type:'text', content:{text:text}})})
      .then(function(){ localStorage.setItem('mira_reg_convs', JSON.stringify(reported)); })
      .catch(function(){ delete reported[convId]; });
  }

  // ===== Coze 对话 API =====
  function api(path, opts){
    return fetch(API + path, {
      method: (opts && opts.method) || 'GET',
      headers: {'Authorization':'Bearer ' + PAT, 'Content-Type':'application/json'},
      body: opts && opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, json:j}; }); });
  }

  function sendMessage(text, isRetry, hiddenText, atts){
    text = (text || '').trim();
    atts = atts || [];
    if(busy) return;
    if(!text && !atts.length) return;
    busy = true;
    sendBtn.disabled = true;
    attachBtn.disabled = true;
    chips.forEach(function(c){ c.disabled = true; });

    // 附件快照（只保存渲染/重试需要的轻量字段，不含 File 对象）
    var attSnap = atts.map(function(at){
      return { name:at.name, isImage:!!at.isImage, thumb:at.thumb||null };
    });

    var userMsg;
    if(isRetry){
      // 重试：最后一条 user 消息已在界面上，只补 typing
      userMsg = null;
    }else{
      userMsg = {role:'user', content:text, attachments: attSnap.length ? attSnap : undefined};
      messages.push(userMsg);
      renderMsg(userMsg);
      persist();
    }

    var typingMsg = {role:'bot', content:'', typing:true};
    var typingEl = renderMsg(typingMsg);

    // 实际发给模型的文本：若有 hiddenText（快捷指令后台话术），用它代替界面显示的气泡内容
    var sendText = hiddenText ? String(hiddenText) : text;
    // 首条消息：把成长锚点追加在消息末尾带给 Mira（仅接口层，界面气泡仍显示学员原文）
    if(!anchorInjected && anchorWord){
      anchorInjected = true;
      sendText = sendText + '（另外：我叫' + name + '，我在开营热身填的成长锚点是「AI永远不能替代我的是' + anchorWord + '」，这个词请你记住、结营成长报告时还给我，现在不用再问我这个词，也不用再问我叫什么。）';
    }

    // 组装文档文字（本地已提取，直接拼进消息，不依赖 Coze 解析）
    var docParts = [];
    atts.forEach(function(at){
      if(!at.isImage && at.docText){
        docParts.push('【附件文档《' + at.name + '》内容如下，请直接阅读并分析】\n' + at.docText);
      }
    });
    if(docParts.length){ sendText = sendText + (sendText ? '\n\n' : '') + docParts.join('\n\n'); }

    // 图片：走多模态 object_string（仅本次发送有效的 fileId；重试时 fileId 已失效则跳过并提示）
    var imgAtts = atts.filter(function(at){ return at.isImage && at.fileId; });
    var imgLost = atts.filter(function(at){ return at.isImage && !at.fileId; });
    if(imgLost.length){
      sendText = sendText + '\n\n（注：刚才有' + imgLost.length + '张图片发送失败，请重新发一次图片。）';
    }
    var addMsgs;
    if(imgAtts.length){
      var parts = [{type:'text', text: sendText || '我发了' + imgAtts.length + '张方案图片，请查看并分析。'}];
      imgAtts.forEach(function(at){ parts.push({type:'image', file_id: at.fileId}); });
      addMsgs = [{role:'user', content: JSON.stringify(parts), content_type:'object_string'}];
    }else{
      addMsgs = [{role:'user', content:sendText, content_type:'text'}];
    }
    var body = {
      bot_id: BOT_ID,
      user_id: uid,
      stream: false,
      auto_save_history: true,
      additional_messages: addMsgs
    };
    if(convId){ body.conversation_id = convId; }

    api('/v3/chat', {method:'POST', body:body}).then(function(res){
      if(!res.ok || !res.json || res.json.code !== 0 || !res.json.data){
        throw new Error('chat create failed: ' + (res.json && res.json.msg));
      }
      var d = res.json.data;
      convId = d.conversation_id;
      localStorage.setItem('mira_conv_id', convId);
      registerConv();
      var chatId = d.id;
      return pollAnswer(convId, chatId);
    }).then(function(answer){
      typingEl.remove();
      var botMsg = {role:'bot', content:answer};
      messages.push(botMsg);
      renderMsg(botMsg);
      persist();
      pendingAtts = [];
      renderAttachBar();
      finishBusy();
    }).catch(function(err){
      typingEl.remove();
      if(userMsg) userMsg.failed = true;
      var failMsg = {role:'bot', content:'刚才没发出去，网络不太稳，点下方重试～', failed:true, retryText:text, retryHidden: hiddenText || null, retryAtts: atts};
      messages.push(failMsg);
      renderMsg(failMsg);
      persist();
      finishBusy();
    });
  }

  function finishBusy(){
    busy = false;
    sendBtn.disabled = false;
    attachBtn.disabled = false;
    chips.forEach(function(c){ c.disabled = false; });
    chatInput.focus();
  }

  // ===== 附件（方案图片/文档）=====
  var IMG_EXT = /\.(png|jpe?g|gif|webp|bmp)$/i;
  function isImageFile(f){ return (f.type && f.type.indexOf('image/')===0) || IMG_EXT.test(f.name); }

  function renderAttachBar(){
    attachBar.innerHTML = '';
    if(!pendingAtts.length){ attachBar.classList.remove('has'); return; }
    attachBar.classList.add('has');
    pendingAtts.forEach(function(at, idx){
      var item = document.createElement('div');
      item.className = 'attach-item';
      if(at.isImage && at.thumb){
        var im = document.createElement('img'); im.src = at.thumb; item.appendChild(im);
      }else{
        var ico = document.createElement('span'); ico.textContent = at.isImage ? '🖼️' : '📄'; item.appendChild(ico);
      }
      var nm = document.createElement('span'); nm.className = 'a-name'; nm.textContent = at.name; item.appendChild(nm);
      var st = document.createElement('span'); st.className = 'a-status';
      st.textContent = at.error ? ('⚠️ ' + at.error) : (at.status === 'ready' ? '✓' : '读取中…');
      st.style.color = at.error ? '#c8622b' : '';
      item.appendChild(st);
      var x = document.createElement('button'); x.type='button'; x.className='a-x'; x.textContent='×';
      x.addEventListener('click', function(){ pendingAtts.splice(idx,1); renderAttachBar(); });
      item.appendChild(x);
      attachBar.appendChild(item);
    });
  }

  function makeThumb(file){
    return new Promise(function(res){
      if(!isImageFile(file)) return res(null);
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        try{
          var scale = Math.min(1, 200/Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          URL.revokeObjectURL(url);
          res(cv.toDataURL('image/jpeg', 0.7));
        }catch(e){ URL.revokeObjectURL(url); res(null); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }

  // 上传图片到 Coze，返回 file_id
  function uploadImage(file){
    return new Promise(function(resolve, reject){
      var fd = new FormData();
      fd.append('purpose', 'file_parse');
      fd.append('file', file, file.name);
      fetch(API + '/v1/files/upload', { method:'POST', headers:{ 'Authorization':'Bearer '+PAT }, body: fd })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j && j.code === 0 && j.data && j.data.id) resolve(j.data.id);
          else reject(new Error((j && j.msg) || 'upload failed'));
        })
        .catch(reject);
    });
  }

  // 文档本地提取文字（txt/md/csv 直接读；docx/pptx/xlsx 用 JSZip 解 XML；pdf 用 pdf.js）
  function extractDocText(file){
    var name = file.name || '';
    var ext = name.split('.').pop().toLowerCase();
    if(['txt','md','csv'].indexOf(ext) >= 0){
      return file.text().then(function(t){ return t.slice(0, 6000); });
    }
    if(ext === 'pdf'){
      if(!window['pdfjsLib']) return Promise.reject(new Error('PDF组件未加载'));
      return file.arrayBuffer().then(function(buf){
        return pdfjsLib.getDocument({data: buf}).promise.then(function(pdf){
          var max = Math.min(pdf.numPages, 15);
          var jobs = [];
          for(var i=1;i<=max;i++){ jobs.push(pdf.getPage(i).then(function(pg){ return pg.getTextContent(); })); }
          return Promise.all(jobs).then(function(contents){
            var txt = contents.map(function(tc){
              return tc.items.map(function(it){ return it.str; }).join(' ');
            }).join('\n');
            return txt.replace(/[ \t]{2,}/g,' ').slice(0, 6000);
          });
        });
      });
    }
    if(['docx','pptx','xlsx'].indexOf(ext) >= 0){
      if(!window['JSZip']) return Promise.reject(new Error('文档组件未加载'));
      return file.arrayBuffer().then(function(buf){
        return JSZip.loadAsync(buf).then(function(zip){
          var reXml = ext === 'pptx' ? /ppt\/slides\/slide\d+\.xml$/ :
                      ext === 'xlsx' ? /xl\/sharedStrings\.xml$/ : /word\/document\.xml$/;
          var names = Object.keys(zip.files).filter(function(n){ return reXml.test(n); }).sort();
          if(!names.length) return '';
          return Promise.all(names.map(function(n){ return zip.files[n].async('string'); })).then(function(xmls){
            var texts = xmls.map(function(x){
              return (x.match(/<a:t>([\s\S]*?)<\/a:t>|<w:t[^>]*>([\s\S]*?)<\/w:t>|<t[^>]*>([\s\S]*?)<\/t>/g) || [])
                .map(function(s){ return s.replace(/<[^>]+>/g,''); }).join(' ');
            });
            return texts.join('\n').replace(/\s{2,}/g,' ').slice(0, 6000);
          });
        });
      });
    }
    // doc/ppt/xls 等旧二进制格式：明确提示
    return Promise.reject(new Error('旧版Office格式不支持，请另存为PDF或新版格式'));
  }

  function addFiles(fileList){
    var files = Array.prototype.slice.call(fileList || []);
    files.forEach(function(f){
      if(f.size > 25*1024*1024){ alert('文件「' + f.name + '」超过25MB，发不了，换小一点的～'); return; }
      var at = { file:f, name:f.name, isImage:isImageFile(f), status:'reading', thumb:null, fileId:null, docText:null, error:null };
      pendingAtts.push(at);
      renderAttachBar();
      var p;
      if(at.isImage){
        p = Promise.all([ makeThumb(f), uploadImage(f) ]).then(function(r){ at.thumb = r[0]; at.fileId = r[1]; });
      }else{
        p = extractDocText(f).then(function(txt){
          at.docText = (txt && txt.trim()) ? txt : null;
          if(!at.docText) at.error = '没提取到文字（可能是扫描件，可截图发来）';
        });
      }
      p.then(function(){
        if(!at.error) at.status = 'ready';
        renderAttachBar();
      }).catch(function(err){
        at.error = (err && err.message) ? err.message : '读取失败';
        renderAttachBar();
      });
    });
    fileInput.value = '';
  }

  function pollAnswer(cid, chatId){
    var tries = 0;
    return new Promise(function(resolve, reject){
      function tick(){
        tries++;
        api('/v3/chat/retrieve?conversation_id=' + encodeURIComponent(cid) + '&chat_id=' + encodeURIComponent(chatId))
          .then(function(res){
            var st = res.json && res.json.data && res.json.data.status;
            if(st === 'completed'){
              return api('/v3/chat/message/list?conversation_id=' + encodeURIComponent(cid) + '&chat_id=' + encodeURIComponent(chatId))
                .then(function(r2){
                  var list = (r2.json && r2.json.data) || [];
                  var parts = [];
                  for(var i=0;i<list.length;i++){
                    if(list[i].role === 'assistant' && list[i].type === 'answer' && list[i].content){
                      parts.push(list[i].content);
                    }
                  }
                  resolve(parts.join('\n\n').trim() || '（镜子里一片安静，再问我一次试试？）');
                });
            }
            if(st === 'failed' || st === 'requires_action' || tries > 40){
              return reject(new Error('chat failed: ' + st));
            }
            setTimeout(tick, 1500);
          })
          .catch(function(e){
            if(tries > 40) return reject(e);
            setTimeout(tick, 1500);
          });
      }
      setTimeout(tick, 1200);
    });
  }

  // ===== 开始：姓名 → 成长锚点热身 → 聊天 =====
  function enterChat(){
    if(started) return;
    started = true;
    anchor.classList.add('hide');
    opening.classList.add('hide');
    setTimeout(function(){
      anchor.style.display = 'none';
      opening.style.display = 'none';
      app.classList.add('show');
      loadHistory();
      if(messages.length === 0){
        var p = {role:'bot', content: PROLOGUE.replace('{name}', name).replace('{anchor}', anchorWord || '___')};
        messages.push(p);
        renderMsg(p);
        persist();
      }
      setTimeout(function(){ chatInput.focus(); }, 300);
    }, 550);
  }

  function showAnchor(){
    opening.classList.add('hide');
    setTimeout(function(){
      opening.style.display = 'none';
      anchor.style.display = 'flex';
      anchor.classList.add('show');
      if(anchorWord) anchorInput.value = anchorWord;
      setTimeout(function(){ anchorInput.focus(); }, 600);
    }, 550);
  }

  function start(){
    var v = nameInput.value.trim();
    if(!v){ nameInput.focus(); nameInput.style.borderColor = '#E8A87C'; return; }
    name = v;
    localStorage.setItem('mira_name', name);
    startBtn.disabled = true;
    startBtn.textContent = '正 在 进 入…';
    opening.classList.add('hide');
    // 已填过锚点的回访学员：直接进聊天
    if(anchorWord){ enterChat(); } else { showAnchor(); }
  }

  function anchorSubmit(){
    var v = anchorInput.value.trim();
    if(!v){ anchorInput.focus(); anchorInput.style.borderColor = '#E8A87C'; return; }
    anchorWord = v;
    localStorage.setItem('mira_anchor', anchorWord);
    anchorBtn.disabled = true;
    anchorBtn.textContent = '正 在 照 镜 子…';
    enterChat();
  }

  startBtn.addEventListener('click', start);
  nameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); start(); }
  });
  anchorBtn.addEventListener('click', anchorSubmit);
  anchorInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); anchorSubmit(); }
  });

  chatForm.addEventListener('submit', function(e){
    e.preventDefault();
    var t = chatInput.value;
    var notReady = pendingAtts.filter(function(at){ return at.status !== 'ready' || at.error; });
    if(notReady.length){
      var errs = pendingAtts.filter(function(at){ return at.error; });
      if(errs.length){
        alert('有文件没读取成功：' + errs.map(function(a){ return a.name; }).join('、') + '\n请点文件旁的 × 删掉，或换成图片/PDF再发。');
      }else{
        alert('附件还在读取中，稍等一秒再发～');
      }
      return;
    }
    if(!t.trim() && !pendingAtts.length) return;
    var attsToSend = pendingAtts.slice();
    pendingAtts = [];
    renderAttachBar();
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendMessage(t, false, null, attsToSend);
  });
  chatInput.addEventListener('input', function(){
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 96) + 'px';
  });

  // 附件按钮
  attachBtn.addEventListener('click', function(){ if(!busy) fileInput.click(); });
  fileInput.addEventListener('change', function(){
    if(fileInput.files && fileInput.files.length) addFiles(fileInput.files);
  });

  chips.forEach(function(c){
    c.addEventListener('click', function(){
      if(busy) return;
      var hidden = c.getAttribute('data-hidden');
      sendMessage(c.getAttribute('data-q'), false, hidden || null, []);
    });
  });

  // 回来的营员：本地已有名字则预填
  if(name){ nameInput.value = name; }

})();
</script>
</body>
